<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <title>FlowDesk</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@360;480;600;700&display=swap">
  <link rel="stylesheet" href="css/desk.css">
</head>
<body>
  <div id="scene"></div>
  <canvas id="dust"></canvas>
  <div id="splash">
    <div class="splash-card">
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M8 46h8l6-16 6 10 6-18 6 24h8" fill="none" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
        <circle cx="48" cy="16" r="4" fill="#00FF66"/>
      </svg>
      <h1>FlowDesk</h1>
      <p class="tag">Read the pressure. Respect the level.</p>
      <p class="sub">Paper desk for forex, indices and futures.</p>
      <button id="enter" type="button">Enter the desk</button>
    </div>
  </div>
  <div id="app" hidden>
    <header class="top">
      <a class="brand" href="#dashboard">
        <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M6 48h10l7-18 7 12 7-22 7 28h10" fill="none" stroke="#00D4FF" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span>FlowDesk</span>
      </a>
      <nav id="nav"></nav>
      <div class="tools">
        <span class="paper">Paper</span>
        <span id="link-state" class="link-state">Demo</span>
      </div>
    </header>
    <div id="demo-banner" hidden>DEMO – sample data. Nothing on this screen is a live quote, a paper fill, or a recommendation.</div>
    <div id="offline-banner" hidden></div>
    <main id="main"></main>
  </div>
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script src="js/desk.js"></script>
</body>
</html>
