# FlowDesk configuration. Secrets never go here - they come from environment (.env).
mode: paper            # paper only. There is no live broker in this codebase.

data:
  provider: yahoo      # yahoo (default, free, futures may be delayed) | oanda (needs OANDA_API_KEY + OANDA_ACCOUNT_ID)
  cache_seconds: 45

watchlist:                    # scanned every cycle; several positions can open in one cycle
  # forex majors
  - {symbol: "EURUSD=X", tf: "15m"}
  - {symbol: "GBPUSD=X", tf: "15m"}
  - {symbol: "USDJPY=X", tf: "15m"}
  - {symbol: "AUDUSD=X", tf: "15m"}
  - {symbol: "USDCAD=X", tf: "15m"}
  - {symbol: "USDCHF=X", tf: "15m"}
  - {symbol: "NZDUSD=X", tf: "15m"}
  # forex minors
  - {symbol: "EURGBP=X", tf: "15m"}
  - {symbol: "EURJPY=X", tf: "15m"}
  - {symbol: "GBPJPY=X", tf: "15m"}
  - {symbol: "AUDJPY=X", tf: "15m"}
  - {symbol: "EURAUD=X", tf: "15m"}
  # index futures
  - {symbol: "NQ=F", tf: "15m"}
  - {symbol: "ES=F", tf: "15m"}
  - {symbol: "YM=F", tf: "15m"}
  - {symbol: "RTY=F", tf: "15m"}
  # metals / energy / crypto
  - {symbol: "GC=F", tf: "15m"}
  - {symbol: "CL=F", tf: "15m"}
  - {symbol: "BTC-USD", tf: "15m"}

telegram:
  auto_alerts: false          # false = Telegram only answers your commands and desk Check presses (no signal/entry/exit/event/tunnel messages)

sizing:                       # win-rate based risk per trade (from the walk-forward backtest of that symbol / setup / score band)
  enabled: true               # loss review 2026-11-25: 5-35% per trade took the account from EUR 50 to EUR 3.79 at a 33% live
  low_sample_n: 20            # win rate - risk cut to 1.5-3% while the edge is unproven (research/loss_review.md)
  base_risk_pct: 1.5          # low sample (n < low_sample_n) or win rate not ready yet
  negative_risk_pct: 1.0      # expectancy below 0R with a small sample
  skip_expectancy_r: 0.0      # skip entirely when expectancy <= this ... (was -0.25: 39%-win / -0.33R setups still traded)
  skip_min_n: 20              # ... and the sample has at least this many trades
  tiers: [[60, 3.0], [50, 2.5], [0, 2.0]]   # [win % at least, risk %] - paper only
  prewarm_minutes: 50         # bot recomputes watchlist win rates in the background this often

quality:                      # win-rate review 2026-11-25 (research/winrate_review.md): each rule raised the held-out win rate
  enabled: true               # without lowering expectancy (after spread + slippage)
  closed_bars_only: true      # decide on CLOSED 15m candles only (61% of live trades since the reset came from a forming candle that flipped)
  min_rr_at_fill: 1.0         # the fill is re-anchored to the live quote; skip if less than 1R is left to TP1
  max_entry_drift_r: 0.15     # skip if price already ran more than 0.15R past the signal close (live fills averaged 0.10R worse)
  max_cost_r: 0.15            # skip when spread + slippage would cost more than 0.15R (stop too tight for the spread; live stops filled 0.12R past)
  block_streams: [setup_hvn]  # HVN Absorption loses after costs (33% win, -0.29R train / -0.24R held-out)
  block_atr_regime: [low]     # quiet markets (ATR < 0.8x median)

gate:                         # evidence gate (flowdesk/guard.py, loss review 2026-11-25): trade a strategy on a symbol only with
  enabled: true               # POSITIVE out-of-sample evidence and no live losing streak there
  min_val_n: 30               # strategy: validation >= 30 trades and > +0.02R ...
  min_val_exp: 0.02
  min_test_n: 10              # ... AND the untouched test segment >= 10 trades and > 0R
  min_test_exp: 0.0
  sym_min_n: 8                # symbol: held-out (validation + test) >= 8 trades on THAT symbol ...
  sym_min_exp: 0.10           # ... averaging at least +0.10R after costs
  live_min_n: 3               # live: >= 3 closed paper trades of that strategy on that symbol averaging <= -0.5R -> off there
  live_kill_exp: -0.5
  clean_since: 1795632000     # 2026-11-25 20:40 Vilnius: trades after the management fix count for the strategy-wide live kill
  strat_live_min_n: 15
  strat_live_kill_exp: -0.25

scanner:
  interval_seconds: 120
  require_killzone: false     # true = only open new trades in London/NY killzones

orderflow:                    # FlowPro-style settings (applied to the ESTIMATED order flow)
  market_pressure: 300        # 300-900: bar |delta| as % of its rolling average needed to count as a pressure surge
  volume_spread: 2.0          # 2-4: bar volume as a multiple of rolling average volume for a volume spike
  lookback: 20
  profile_bars: 120           # bars used for the volume profile (POC / HVN)
  profile_bins: 40

strategy:
  lookback_bars: 300      # engine window (live and backtest use the same)
  min_score: 55               # minimum confluence score (0-100) to call LONG/SHORT
  min_margin: 15              # winning side must beat the other side by this many points
  swing_k: 2                  # fractal pivot width for swings
  atr_period: 14
  sl_buffer_atr: 0.25
  min_sl_atr: 0.6
  max_sl_atr: 3.0
  min_rr_tp1: 1.0
  default_rr_tp2: 2.5

events:
  block_minutes_before: 30    # no new entries this many minutes before a high-impact event for the instrument
  block_minutes_after: 15
  warn_hours: 12              # /check warns about high-impact events in the next N hours
  calendar_cache_minutes: 30
  news_cache_minutes: 5
  rss_feeds:
    - https://www.fxstreet.com/rss/news
    - https://www.investing.com/rss/news_1.rss
    - https://www.cnbc.com/id/20910258/device/rss/rss.html
    - https://feeds.content.dowjones.io/public/rss/mw_topstories

endpoint_publish:            # tunnel URL changes -> docs/endpoint.json (URL only, never the key) so the saved desk reconnects
  enabled: true
  repo_dir: ~/flowdesk-repo
  ssh_key: ~/.ssh/flowdesk_deploy
  remote: git@github.com:emiiss67/Flow-desk.git
  branch: main

broker:
  account_currency: EUR       # balance, sizing and P&L are kept in this currency (live FX from the data provider)
  starting_balance: 50        # paper balance in the account currency (€50)
  risk_pct: 7.0               # legacy fixed risk % (only used when win-rate sizing is off)
  min_qty: 0                  # 0 = fractional units/contracts allowed (paper/CFD-style). >0 rejects smaller sizes
  qty_step: 0                 # 0 = no rounding; e.g. 0.01 to round lots down to a step
  max_leverage: 5000          # paper notional cap = equity x this; high so 80% risk on a tight forex stop isn't cut
  max_positions: 4            # concurrent paper positions across all symbols (loss review 2026-11-25: was 15)
  max_risk_per_trade_pct: 3.0 # hard cap on any single trade, whatever the sizing says
  daily_loss_limit_pct: 6.0   # stop opening trades after losing this % of day-start equity (was 30)
  max_per_symbol: 2          # a 2nd position on a symbol only if it comes from a different setup
  max_open_risk_pct: 8.0      # total risk of all open trades (to their stops) can't exceed this % of equity (was 60)
  max_same_direction_risk_pct: 6.0    # all open BUY (or all SELL) trades together can't risk more than this % of equity (was 45)
  max_same_direction_open: 2          # max open BUY (or SELL) trades across ALL symbols (win-rate review 2026-11-25)
  max_same_direction_per_group: 2     # max open trades betting the same way inside one correlated group
                                      # (stock indices+crypto+AUD/NZD-JPY = risk-on, yen pairs, US-dollar pairs)
  tp1_close_pct: 50           # % of position closed at TP1, then stop to breakeven
  trail_atr: 1.0              # after TP1, trail stop at this many ATR
  spread_bps: {forex: 0.8, indices: 1.0, futures: 1.0, commodities: 2.0, crypto: 5.0, rates: 1.0, other: 2.0}
  slippage_bps: 0.5

api:
  host: 127.0.0.1
  port: 8790
  cors_origins: ["https://emiiss67.github.io", "http://localhost:8000", "http://127.0.0.1:8000"]

desk_url: https://emiiss67.github.io/Flow-desk/
